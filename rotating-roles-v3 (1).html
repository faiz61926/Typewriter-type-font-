<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>I am — Rotating Roles</title>
  <style>
    :root {
      --text: #37352f;
      --muted: rgba(55, 53, 47, 0.72);
      --cursor: #37352f;
      --font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --text: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.62);
        --cursor: rgba(255, 255, 255, 0.85);
      }
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 64px;
      background: transparent;
      font-family: var(--font);
      color: var(--text);
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      background: transparent;
    }

    .line {
      width: 100%;
      padding: 6px 0;
      font-size: 17px;
      line-height: 1.45;
      letter-spacing: -0.01em;
      color: var(--text);
      background: transparent;
    }

    .prefix {
      color: var(--muted);
      font-weight: 500;
      margin-right: 6px;
    }

    .role {
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
    }

    .cursor {
      display: inline-block;
      margin-left: 2px;
      color: var(--cursor);
      animation: blink 1s steps(1, end) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .cursor { animation: none; }
    }
  </style>
</head>
<body>
  <main class="line" aria-label="Professional roles">
    <span class="prefix">I am:</span>
    <span class="role" aria-live="polite" aria-atomic="true"><span id="text">Author</span><span class="cursor" aria-hidden="true">|</span></span>
  </main>

  <script>
    const roles = [
      "Author",
      "Editor",
      "Ghostwriter",
      "Copywriter",
      "Proofreader",
      "Content Strategist",
      "SEO Specialist"
    ];

    const msPerRole = 2000;
    const typingSpeed = 62;
    const deletingSpeed = 34;
    const holdAfterTyped = Math.max(500, msPerRole - 900);
    const textEl = document.getElementById("text");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    if (reduceMotion) {
      textEl.textContent = roles.join(" · ");
    } else {
      let roleIndex = 0;
      let charIndex = roles[0].length;
      let deleting = true;
      let holdUntil = performance.now() + holdAfterTyped;

      function step(now) {
        const current = roles[roleIndex];

        if (holdUntil && now < holdUntil) {
          requestAnimationFrame(step);
          return;
        }
        holdUntil = 0;

        if (deleting) {
          charIndex = Math.max(0, charIndex - 1);
          textEl.textContent = current.slice(0, charIndex);
          if (charIndex === 0) {
            deleting = false;
            roleIndex = (roleIndex + 1) % roles.length;
            holdUntil = now + 120;
          }
          setTimeout(() => requestAnimationFrame(step), deletingSpeed);
        } else {
          const next = roles[roleIndex];
          charIndex = Math.min(next.length, charIndex + 1);
          textEl.textContent = next.slice(0, charIndex);
          if (charIndex === next.length) {
            deleting = true;
            holdUntil = now + holdAfterTyped;
          }
          setTimeout(() => requestAnimationFrame(step), typingSpeed);
        }
      }

      requestAnimationFrame(step);
    }
  </script>
</body>
</html>
